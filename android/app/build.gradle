def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (!flutterRoot) {
    flutterRoot = System.getenv('FLUTTER_ROOT') ?: System.getenv('FLUTTER_HOME')
}
if (!flutterRoot && java.lang.System.getProperty('flutter.sdk')) {
    flutterRoot = java.lang.System.getProperty('flutter.sdk')
}
if (!flutterRoot) {
    try {
        def whichCmd = System.getProperty("os.name").toLowerCase().contains("win") ? "where flutter" : "which flutter"
        def flutterBin = whichCmd.execute().text.trim().split("\r?\n")[0]
        if (flutterBin) {
            flutterRoot = new File(flutterBin).parentFile.parent
        }
    } catch (Exception e) {}
}
assert flutterRoot != null, "Flutter SDK path not found"

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def isModernFlutter = new File("$flutterRoot/packages/flutter_tools/gradle/build.gradle.kts").exists()

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
if (isModernFlutter) {
    apply plugin: 'dev.flutter.flutter-gradle-plugin'
} else {
    apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
}

android {
    namespace "com.timeloopescapes.game"
    compileSdkVersion 33
    if (isModernFlutter) {
        ndkVersion flutter.ndkVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.timeloopescapes.game"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
