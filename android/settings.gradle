pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def file = new File(rootDir, 'local.properties')
        if (file.exists()) {
            file.withReader('UTF-8') { reader -> properties.load(reader) }
        }
        def sdkPath = properties.getProperty('flutter.sdk')
        if (!sdkPath) {
            sdkPath = System.getenv('FLUTTER_ROOT') ?: System.getenv('FLUTTER_HOME')
        }
        if (!sdkPath) {
            try {
                def flutterBin = "which flutter".execute().text.trim()
                if (flutterBin) {
                    sdkPath = new File(flutterBin).parentFile.parent
                }
            } catch (Exception e) {}
        }
        assert sdkPath, "flutter.sdk not set"
        return sdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

include ":app"
