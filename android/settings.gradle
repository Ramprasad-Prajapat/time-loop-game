pluginManagement {
    def properties = new Properties()
    def file = new File(rootDir, 'local.properties')
    if (file.exists()) {
        file.withReader('UTF-8') { reader -> properties.load(reader) }
    }
    def sdkPath = properties.getProperty('flutter.sdk') ?: System.getenv('FLUTTER_ROOT') ?: System.getenv('FLUTTER_HOME')
    if (!sdkPath && java.lang.System.getProperty('flutter.sdk')) {
        sdkPath = java.lang.System.getProperty('flutter.sdk')
    }
    if (!sdkPath) {
        try {
            def whichCmd = System.getProperty("os.name").toLowerCase().contains("win") ? "where flutter" : "which flutter"
            def flutterBin = whichCmd.execute().text.trim().split("\r?\n")[0]
            if (flutterBin) {
                sdkPath = new File(flutterBin).parentFile.parent
            }
        } catch (Exception e) {}
    }

    if (sdkPath && new File("$sdkPath/packages/flutter_tools/gradle/build.gradle.kts").exists()) {
        includeBuild("$sdkPath/packages/flutter_tools/gradle")
    }

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0" apply false
    id "com.android.application" version "7.4.2" apply false
    id "org.jetbrains.kotlin.android" version "1.8.22" apply false
}

include ':app'

def localPropertiesFile = new File(rootProject.projectDir, "local.properties")
def properties = new Properties()

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        properties.load(reader)
    }
}

def flutterSdkPath = properties.getProperty("flutter.sdk")
if (!flutterSdkPath) {
    flutterSdkPath = System.getenv("FLUTTER_ROOT") ?: System.getenv("FLUTTER_HOME")
}
if (!flutterSdkPath && java.lang.System.getProperty("flutter.sdk")) {
    flutterSdkPath = java.lang.System.getProperty("flutter.sdk")
}
if (!flutterSdkPath) {
    try {
        def whichCmd = System.getProperty("os.name").toLowerCase().contains("win") ? "where flutter" : "which flutter"
        def flutterBin = whichCmd.execute().text.trim().split("\r?\n")[0]
        if (flutterBin) {
            flutterSdkPath = new File(flutterBin).parentFile.parent
        }
    } catch (Exception e) {}
}

assert flutterSdkPath != null, "flutter.sdk not set in local.properties, FLUTTER_ROOT, or PATH"

def modernGradle = new File("$flutterSdkPath/packages/flutter_tools/gradle/build.gradle.kts").exists()
if (modernGradle) {
    apply plugin: "dev.flutter.flutter-plugin-loader"
} else {
    apply from: "$flutterSdkPath/packages/flutter_tools/gradle/app_plugin_loader.gradle"
}
